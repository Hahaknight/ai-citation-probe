[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-citation-probe"
version = "0.1.0a0"
description = "Reproducible AI citation and visibility measurement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
ai-citation-probe = "ai_citation_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
